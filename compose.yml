name: mental
services:
  frontend:
    image: ghcr.io/mrtgm/mental-frontend:prod
    container_name: frontend-prod
    init: true
    restart: always
    profiles: ["prod"]
    networks:
      - caddy
    environment:
      - ENV=production
      - PORT=${FRONTEND_PROD_PORT}
    depends_on:
      - backend

  backend:
    image: ghcr.io/mrtgm/mental-backend:prod
    container_name: backend-prod
    init: true
    restart: always
    profiles: ["prod"]
    networks:
      - caddy
      - db
    environment:
      - ENV=production
      - PORT=${BACKEND_PROD_PORT}
    depends_on:
      db:
        condition: service_healthy

  frontend-staging:
    image: ghcr.io/mrtgm/mental-frontend:staging
    container_name: frontend-staging
    init: true
    restart: always
    profiles: ["staging"]
    networks:
      - caddy
    environment:
      - ENV=development
      - PORT=${FRONTEND_STAGING_PORT}
    depends_on:
      - backend-staging

  backend-staging:
    image: ghcr.io/mrtgm/mental-backend:staging
    container_name: backend-staging
    init: true
    restart: always
    profiles: ["staging"]
    networks:
      - caddy
      - db
    environment:
      - ENV=development
      - PORT=${BACKEND_STAGING_PORT}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15
    container_name: mental-db
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    environment:
      POSTGRES_USER: mental
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    networks:
      - db
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mental"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:

secrets:
  tunnel_token:
    file: ../../secrets/cloudflare_tunnel_token
  ssh_token:
    file: ../../secrets/cloudflare_ssh_token
  postgres_password:
    file: ../../secrets/postgres_password

networks:
  db:
    driver: bridge
    name: db-network

  caddy:
    external: true
    name: caddy-network
